services:
  - type: web
    name: contractiq-guard-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://contractiq-rlqk103ur-umayas-projects-d6c6dda4.vercel.app/
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_INTERNAL_SECRET
        sync: false
  - type: web
    name: contractiq-ai-service
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: test
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: AI_INTERNAL_SECRET
        sync: false
